<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
    <link  rel="stylesheet" href="main.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Story+Script&display=swap" rel="stylesheet">
    <title>Form com Bootstrap</title>
</head>
<body>
    <div class="row">
            <div class="col">
                <div class="formulario">
                    <div class="cabecalho">
                        <img src="./imagens/jornal.png" alt="Icone de um jornal" />
                        <h2>Assine nossa newlester</h2>
                        <p>E fique por dentro das nóticias do meio ambiente!</p>
                    </div>
                    <form>
                        <label class="form-label" for="name">Nome completo: </label>
                        <input class="form-control" type="text" id="name" />
                        <label for="email" class="form-label">Email:</label>
                        <input type="email" class="form-control" id="email"/>
                        <label for="telefone" class="form-label">Telefone:</label>
                        <input type="tel" class="form-control" id="telefone"/>
                        <div class="form-check form-switch">
                            <label class="form-check-label"  for="aceito-termos" class="form-label">Quero ficar por dentro das novidades</label>
                            <input class="form-check-input" type="checkbox" id="aceito-termos" class="">
                        </div>
                        <button class="btn btn-success">Enviar</button>
                    </form>
                </div>
            </div>
        </div>
    </div>


    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js" integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI" crossorigin="anonymous"></script>
</body>
</html>
